; Copy this file to ~/.taskbot/config.ini (or $TASKBOT_HOME/config.ini)
; and fill it in to enable email notifications (`--notify-method email`).
[email]
smtp_host = smtp.gmail.com
smtp_port = 587
; For Gmail, create an App Password (Google Account > Security > 2-Step
; Verification > App passwords) -- do not use your normal account password.
username = your_email@gmail.com
password = your_app_password
from_addr = your_email@gmail.com
to_addr = your_email@gmail.com
use_tls = true
