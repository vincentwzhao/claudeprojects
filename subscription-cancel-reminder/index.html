<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cancel Reminder</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>Cancel Reminder</h1>
    <p class="subtitle">Track subscriptions so you cancel them before they renew.</p>
  </header>

  <section class="banner" id="banner" hidden></section>

  <section class="add-form">
    <h2>Add a subscription</h2>
    <form id="sub-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Netflix" required />
      </div>
      <div class="field">
        <label for="cost">Cost</label>
        <input type="number" id="cost" placeholder="15.99" step="0.01" min="0" />
      </div>
      <div class="field">
        <label for="renewal-date">Next renewal date</label>
        <input type="date" id="renewal-date" required />
      </div>
      <div class="field">
        <label for="cycle">Billing cycle</label>
        <select id="cycle">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
          <option value="weekly">Weekly</option>
          <option value="once">One-time / trial</option>
        </select>
      </div>
      <div class="field">
        <label for="lead-days">Remind me this many days before</label>
        <input type="number" id="lead-days" value="3" min="0" max="60" />
      </div>
      <button type="submit">Add subscription</button>
    </form>
  </section>

  <section class="list-section">
    <h2>Your subscriptions</h2>
    <div id="empty-state" class="empty-state" hidden>
      No subscriptions tracked yet. Add one above.
    </div>
    <ul id="sub-list"></ul>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
